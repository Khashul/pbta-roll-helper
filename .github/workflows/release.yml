name: Release

# Runs whenever a tag like v1.0.0 is pushed. Builds module.zip with module.json
# at the archive root (required for Foundry's manifest/download install flow -
# it extracts the zip directly into the module's folder, so there must be no
# extra wrapping folder inside it) and attaches both module.json and module.zip
# to a new GitHub Release matching the tag.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build module.zip
        run: zip -r module.zip . -x ".git/*" -x ".github/*" -x "*.zip"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            module.json
            module.zip
          generate_release_notes: true
